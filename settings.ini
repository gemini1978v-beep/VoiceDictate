; Настройки программы. Их удобнее менять прямо в окне.
[general]
; Клавиша: 1-е нажатие — запись с микрофона, 2-е — распознать (Whisper) и отправить
hotkey_dictate = F3
; Файл модели Whisper в папке models
model = ggml-small-q5_1.bin
; Микрофон: -1 — по умолчанию, 0, 1, 2… — номер в списке
mic_device = -1
; Язык речи: ru, en, uk… или auto
language = ru
; Подсказка для Whisper: пример текста в нужном стиле (помогает с пунктуацией)
prompt = Привет. Это текст на русском языке, с правильной пунктуацией: запятыми, точками и вопросами?
; Распознавать на видеокарте NVIDIA, если скачано ускорение (папка whisper-cuda) (yes / no)
gpu = yes
; Сразу отправлять распознанный текст в активное окно (yes / no)
auto_send = yes
; Нажимать Enter после вставки (yes / no)
press_enter = no
; Задержка перед Enter, секунды (например 0.2)
enter_delay = 0.2
; Печатать посимвольно вместо Ctrl+V (yes / no)
type_text = no
; Окно программы поверх остальных (yes / no)
topmost = yes
; Интерфейс: web — новый (нужен WebView2, есть в Windows 10/11), classic — старое окно
ui = web
; Тема окна: light — светлая, dark — тёмная (переключатель рядом с шестерёнкой)
theme = light
